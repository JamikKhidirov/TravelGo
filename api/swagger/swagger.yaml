openapi: 3.0.3
info:
  title: GoTravel API
  description: Travel service in Go. Aggregates destinations and tours from multiple MSP servers, stores data in PostgreSQL, caches in Redis, streams realtime geolocation over WebSocket and exposes REST endpoints.
  version: 1.4.0
servers:
  - url: http://localhost:8080
    description: Local Docker
  - url: http://travel-app:8080
    description: Docker network
tags:
  - name: health
  - name: destinations
  - name: tours
  - name: events
  - name: sync
  - name: auth
  - name: sessions
  - name: mfa
  - name: passkeys
  - name: oauth
  - name: cart
  - name: orders
  - name: payments
  - name: reviews
  - name: vouchers
  - name: tickets
  - name: push
  - name: admin
  - name: realtime
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    userHeader:
      type: apiKey
      in: header
      name: X-User-Id
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    PageSize:
      name: page_size
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    IdPath:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    ItemIdPath:
      name: item_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderIdPath:
      name: order_id
      in: path
      required: true
      schema: { type: string, format: uuid }
    TourIdPath:
      name: tour_id
      in: path
      required: true
      schema: { type: string, format: uuid }
  schemas:
    Response:
      type: object
      properties:
        success: { type: boolean }
        data: { type: object }
        error: { type: string }
        meta: { type: object }
    RegisterRequest:
      type: object
      required: [email, password, first_name, last_name]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, minLength: 6, example: password123 }
        first_name: { type: string, example: John }
        last_name: { type: string, example: Doe }
        phone: { type: string, example: "+1234567890" }
        role: { type: string, enum: [user, guide, partner], default: user, description: Admin accounts are provisioned by the operator }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email, example: user@example.com }
        password: { type: string, example: password123 }
    TokenPair:
      type: object
      properties:
        access_token: { type: string, description: HS256 JWT access token }
        token: { type: string, description: Legacy alias of access_token }
        refresh_token: { type: string, description: Opaque rotating refresh token }
        id_token: { type: string, description: OIDC ID token (HS256) }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 1800 }
        session_id: { type: string, format: uuid }
    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: Legacy alias of tokens.access_token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        tokens:
          $ref: '#/components/schemas/TokenPair'
    MFALoginRequest:
      type: object
      required: [mfa_token, code]
      properties:
        mfa_token: { type: string, description: Short-lived token returned by /auth/login when MFA is enabled }
        code: { type: string, minLength: 6, maxLength: 6, example: "123456" }
    MFARequiredResponse:
      type: object
      properties:
        mfa_required: { type: boolean, example: true }
        mfa_token: { type: string }
        user_id: { type: string, format: uuid }
    MFAVerifyRequest:
      type: object
      required: [code]
      properties:
        code: { type: string, minLength: 6, maxLength: 6, example: "123456" }
    MFASetupResponse:
      type: object
      properties:
        secret: { type: string, example: JBSWY3DPEHPK3PXP }
        otpauth_url: { type: string, example: "otpauth://totp/GoTravel:user@example.com?secret=...&issuer=GoTravel" }
        issuer: { type: string, example: GoTravel }
        digits: { type: integer, example: 6 }
        period: { type: integer, example: 30 }
        algorithm: { type: string, example: SHA1 }
    SessionInfo:
      type: object
      properties:
        id: { type: string, format: uuid }
        session_id: { type: string, format: uuid }
        device: { type: string, example: iPhone 15 }
        device_name: { type: string }
        platform: { type: string, enum: [ios, android, web] }
        ip: { type: string, example: 203.0.113.10 }
        user_agent: { type: string }
        login_at: { type: string, format: date-time }
        last_seen_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
        revoked_at: { type: string, format: date-time, nullable: true }
        is_current: { type: boolean }
        is_active: { type: boolean }
    SessionsResponse:
      type: object
      properties:
        sessions:
          type: array
          items: { $ref: '#/components/schemas/SessionInfo' }
        summary:
          type: object
          properties:
            total_sessions: { type: integer }
            active_sessions: { type: integer }
            platforms: { type: object, additionalProperties: { type: integer } }
            unique_ips: { type: array, items: { type: string } }
            last_login_at: { type: string, format: date-time }
            last_activity_at: { type: string, format: date-time }
            current_session_id: { type: string, format: uuid }
    PasskeyRegistrationFinishRequest:
      type: object
      required: [credential_id, challenge_token]
      properties:
        credential_id: { type: string, description: Base64url credential ID }
        client_data_json: { type: string, description: Base64url clientDataJSON }
        attestation_object: { type: string }
        transports: { type: string, example: internal }
        challenge_token: { type: string, description: Token from passkeys/register/begin }
    PasskeyLoginFinishRequest:
      type: object
      required: [credential_id, challenge_token]
      properties:
        credential_id: { type: string }
        client_data_json: { type: string }
        challenge_token: { type: string }
    OAuthAuthorizeRequest:
      type: object
      required: [client_id, redirect_uri, code_challenge]
      properties:
        response_type: { type: string, enum: [code], default: code }
        client_id: { type: string, example: gotravel-mobile }
        redirect_uri: { type: string, example: "gotravel://callback" }
        scope: { type: string, example: "openid profile email offline_access" }
        state: { type: string }
        code_challenge: { type: string, description: Base64url SHA-256 of the PKCE verifier }
        code_challenge_method: { type: string, enum: [S256], default: S256 }
        nonce: { type: string }
        email: { type: string, description: Optional when a Bearer token is supplied }
        password: { type: string }
    OAuthTokenRequest:
      type: object
      required: [grant_type]
      properties:
        grant_type: { type: string, enum: [authorization_code, refresh_token] }
        code: { type: string }
        redirect_uri: { type: string }
        client_id: { type: string }
        code_verifier: { type: string }
        refresh_token: { type: string }
    ChangePasswordRequest:
      type: object
      required: [old_password, new_password]
      properties:
        old_password: { type: string, example: password123 }
        new_password: { type: string, minLength: 6, example: newpass456 }
    UpdateProfileRequest:
      type: object
      properties:
        first_name: { type: string, example: John }
        last_name: { type: string, example: Doe }
        phone: { type: string, example: "+1234567890" }
    User:
      type: object
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        first_name: { type: string }
        last_name: { type: string }
        phone: { type: string }
        role: { type: string, enum: [user, admin] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Destination:
      type: object
      required: [name, country, city]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        name: { type: string, example: Rome }
        country: { type: string, example: Italy }
        city: { type: string, example: Rome }
        description: { type: string }
        image_url: { type: string }
        rating: { type: number, format: float, example: 4.8 }
        price_from: { type: number, format: float, example: 1200 }
        currency: { type: string, example: USD }
        source: { type: string, readOnly: true }
        external_id: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Tour:
      type: object
      required: [destination_id, title, price, duration_days]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        destination_id: { type: string, format: uuid }
        title: { type: string, example: Rome Weekend }
        description: { type: string }
        price: { type: number, format: float, example: 500 }
        currency: { type: string, example: USD }
        duration_days: { type: integer, example: 3 }
        start_date: { type: string, format: date-time }
        end_date: { type: string, format: date-time }
        available: { type: boolean, default: true }
        image_url: { type: string }
        source: { type: string, readOnly: true }
        external_id: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    Voucher:
      type: object
      required: [title, destination_id, price]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        title: { type: string, example: Summer Deal }
        description: { type: string }
        destination_id: { type: string, format: uuid }
        price: { type: number, format: float, example: 900 }
        currency: { type: string, example: USD }
        duration_nights: { type: integer, example: 7 }
        includes_flight: { type: boolean }
        includes_hotel: { type: boolean }
        includes_meal: { type: boolean }
        image_url: { type: string }
        is_active: { type: boolean, default: true }
        created_at: { type: string, format: date-time, readOnly: true }
    AddToCartRequest:
      type: object
      required: [tour_id, price]
      properties:
        tour_id: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, default: 1 }
        price: { type: number, format: float, example: 500 }
    UpdateCartItemRequest:
      type: object
      required: [quantity]
      properties:
        quantity: { type: integer, minimum: 1, example: 2 }
    CheckoutRequest:
      type: object
      required: [tour_id, destination_id, passenger_name, passenger_email]
      properties:
        tour_id: { type: string, format: uuid }
        destination_id: { type: string, format: uuid }
        passenger_name: { type: string, example: John Doe }
        passenger_email: { type: string, format: email, example: user@example.com }
        passenger_phone: { type: string, example: "+1234567890" }
        travel_date: { type: string, format: date-time }
        nights: { type: integer, minimum: 1, example: 5 }
        adults: { type: integer, minimum: 1, example: 2 }
        children: { type: integer, minimum: 0, example: 1 }
    OrderStatusRequest:
      type: object
      required: [status]
      properties:
        status: { type: string, enum: [pending, paid, cancelled, completed] }
    CreatePaymentRequest:
      type: object
      required: [order_id, amount, provider]
      properties:
        order_id: { type: string, format: uuid }
        amount: { type: number, format: float, example: 500 }
        currency: { type: string, example: USD }
        provider: { type: string, example: stripe }
    CreateReviewRequest:
      type: object
      required: [tour_id, rating]
      properties:
        tour_id: { type: string, format: uuid }
        rating: { type: integer, minimum: 1, maximum: 5, example: 5 }
        comment: { type: string, example: Great tour }
    Cart:
      type: object
      properties:
        cart: { type: object }
        items:
          type: array
          items:
            type: object
            properties:
              id: { type: string, format: uuid }
              tour_id: { type: string, format: uuid }
              quantity: { type: integer }
              price_at_add: { type: number, format: float }
    Order:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        destination_id: { type: string, format: uuid }
        status: { type: string }
        total_price: { type: number, format: float }
        currency: { type: string }
        passenger_name: { type: string }
        passenger_email: { type: string }
        travel_date: { type: string, format: date-time }
        nights: { type: integer }
        adults: { type: integer }
        children: { type: integer }
    Payment:
      type: object
      properties:
        id: { type: string, format: uuid }
        order_id: { type: string, format: uuid }
        amount: { type: number, format: float }
        currency: { type: string }
        status: { type: string, enum: [pending, success, failed] }
        provider: { type: string }
        transaction_id: { type: string }
    Review:
      type: object
      properties:
        id: { type: string, format: uuid }
        tour_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        rating: { type: integer }
        comment: { type: string }
        created_at: { type: string, format: date-time }
    SyncJob:
      type: object
      properties:
        id: { type: string, format: uuid }
        source: { type: string }
        status: { type: string, enum: [pending, running, completed, failed] }
        records: { type: integer }
        error: { type: string }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Ticket:
      type: object
      required: [type, origin_city, destination_city, departure_at, arrival_at, price]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        type: { type: string, enum: [flight, train, bus] }
        provider: { type: string }
        origin_city: { type: string, example: Moscow }
        origin_country: { type: string, example: Russia }
        destination_city: { type: string, example: Istanbul }
        destination_country: { type: string, example: Turkey }
        departure_at: { type: string, format: date-time }
        arrival_at: { type: string, format: date-time }
        price: { type: number, format: float, example: 250 }
        currency: { type: string, example: USD }
        carrier: { type: string, example: Aeroflot }
        number: { type: string, example: FL501 }
        class: { type: string, example: economy }
        available_seats: { type: integer, example: 24 }
        source: { type: string, readOnly: true }
        external_id: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    DeviceToken:
      type: object
      required: [platform, token]
      properties:
        id: { type: string, format: uuid, readOnly: true }
        user_id: { type: string, format: uuid }
        platform: { type: string, enum: [ios, android, web] }
        token: { type: string, example: fcm-or-apns-token }
        app_version: { type: string, example: 1.0.0 }
        is_active: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    PushRequest:
      type: object
      required: [title, body]
      properties:
        user_id: { type: string, format: uuid, description: Empty means all devices }
        platform: { type: string, enum: [ios, android, web] }
        title: { type: string, example: GoTravel }
        body: { type: string, example: New tours are available }
        data: { type: object, additionalProperties: { type: string }, example: { screen: tours } }
    PushNotification:
      type: object
      properties:
        id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        title: { type: string }
        body: { type: string }
        data: { type: string }
        platform: { type: string }
        status: { type: string }
        sent_count: { type: integer }
        failed_count: { type: integer }
        created_at: { type: string, format: date-time }
security:
  - bearerAuth: []
  - userHeader: []
paths:
  /health:
    get:
      tags: [health]
      summary: Health check
      security: []
      responses:
        '200': { description: OK, content: { application/json: { schema: { $ref: '#/components/schemas/Response' } } } }
  /api/v1/health:
    get:
      tags: [health]
      summary: Health check (versioned)
      security: []
      responses:
        '200': { description: OK }
  /api/v1/destinations:
    get:
      tags: [destinations]
      summary: List destinations
      security: []
      parameters:
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: OK }
    post:
      tags: [destinations]
      summary: Create destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Destination' }
      responses:
        '201': { description: Created }
  /api/v1/destinations/search:
    get:
      tags: [destinations]
      summary: Search destinations
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: country, in: query, schema: { type: string } }
        - { name: city, in: query, schema: { type: string } }
        - { name: min_rating, in: query, schema: { type: number, format: float } }
        - { name: max_price, in: query, schema: { type: number, format: float } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: OK }
  /api/v1/destinations/top:
    get:
      tags: [destinations]
      summary: Top destinations
      security: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: OK }
  /api/v1/destinations/countries:
    get:
      tags: [destinations]
      summary: List countries
      security: []
      responses:
        '200': { description: OK }
  /api/v1/destinations/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [destinations]
      summary: Get destination
      security: []
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    put:
      tags: [destinations]
      summary: Update destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Destination' }
      responses:
        '200': { description: OK }
    delete:
      tags: [destinations]
      summary: Delete destination
      responses:
        '200': { description: OK }
  /api/v1/tours:
    get:
      tags: [tours]
      summary: List tours
      security: []
      parameters:
        - { name: destination_id, in: query, schema: { type: string, format: uuid } }
        - { name: available, in: query, schema: { type: boolean } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: OK }
    post:
      tags: [tours]
      summary: Create tour
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tour' }
      responses:
        '201': { description: Created }
  /api/v1/tours/search:
    get:
      tags: [tours]
      summary: Search tours
      security: []
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: destination_id, in: query, schema: { type: string, format: uuid } }
        - { name: available, in: query, schema: { type: boolean } }
        - { name: min_price, in: query, schema: { type: number, format: float } }
        - { name: max_price, in: query, schema: { type: number, format: float } }
        - { name: min_duration, in: query, schema: { type: integer } }
        - { name: max_duration, in: query, schema: { type: integer } }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200': { description: OK }
  /api/v1/tours/featured:
    get:
      tags: [tours]
      summary: Featured tours
      security: []
      parameters:
        - { name: limit, in: query, schema: { type: integer, default: 10 } }
      responses:
        '200': { description: OK }
  /api/v1/tours/{id}:
    parameters:
      - $ref: '#/components/parameters/IdPath'
    get:
      tags: [tours]
      summary: Get tour
      security: []
      responses:
        '200': { description: OK }
        '404': { description: Not found }
    put:
      tags: [tours]
      summary: Update tour
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Tour' }
      responses:
        '200': { description: OK }
    delete:
      tags: [tours]
      summary: Delete tour
      responses:
        '200': { description: OK }
  /api/v1/events:
    get:
      tags: [events]
      summary: Travel events
      security: []
      parameters:
        - { name: aggregate, in: query, schema: { type: string } }
        - { name: aggregate_id, in: query, schema: { type: string, format: uuid } }
        - { name: limit, in: query, schema: { type: integer, default: 50 } }
      responses:
        '200': { description: OK }
  /api/v1/sync:
    post:
      tags: [sync]
      summary: Sync all MSP and public sources
      responses:
        '200': { description: Sync completed }
  /api/v1/sync/jobs:
    get:
      tags: [sync]
      summary: List sync jobs
      responses:
        '200': { description: OK }
  /api/v1/auth/register:
    post:
      tags: [auth]
      summary: Register user
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RegisterRequest' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResponse' }
  /api/v1/auth/login:
    post:
      tags: [auth]
      summary: Login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AuthResponse' }
        '401': { description: Invalid credentials }
  /api/v1/auth/me:
    get:
      tags: [auth]
      summary: Current user from headers or token
      responses:
        '200': { description: OK }
  /api/v1/auth/profile:
    get:
      tags: [auth]
      summary: Get profile
      responses:
        '200': { description: OK }
    put:
      tags: [auth]
      summary: Update profile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileRequest' }
      responses:
        '200': { description: OK }
  /api/v1/auth/change-password:
    post:
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChangePasswordRequest' }
      responses:
        '200': { description: OK }
        '400': { description: Invalid old password }
  /api/v1/auth/refresh:
    post:
      tags: [auth]
      summary: Rotate refresh token
      description: Rotates the opaque refresh token and returns a fresh token pair bound to the same session.
