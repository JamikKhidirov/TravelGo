services:
  postgres:
    image: postgres:16-alpine
    container_name: travel-postgres
    environment:
      POSTGRES_USER: travel
      POSTGRES_PASSWORD: travelpass
      POSTGRES_DB: travel_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travel -d travel_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: travel-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: travel-app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      APP_ENV: docker
      APP_PORT: 8080
      CONFIG_PATH: /configs/config.yaml
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: travel
      DB_PASSWORD: travelpass
      DB_NAME: travel_db
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: localhost:9092
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
    volumes:
      - ./configs/config.yaml:/configs/config.yaml
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
