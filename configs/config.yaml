app:
  name: go-travel
  env: development
  port: 8080
  read_timeout: 10s
  write_timeout: 10s

db:
  host: localhost
  port: 5432
  user: travel
  password: travelpass
  name: travel_db
  sslmode: disable
  max_open_conns: 25
  max_idle_conns: 10
  conn_max_lifetime: 300s

redis:
  addr: localhost:6379
  password: ""
  db: 0

kafka:
  brokers:
    - localhost:9092
  topic_travel_events: travel.events
  topic_sync: travel.sync
  consumer_group: travel-app

server:
  origin: "*"

mock:
  enabled: true
  base_url: http://localhost:8081

security:
  # Empty list disables X-Forwarded-For trust (safe default).
  trusted_proxies: []
  # Development-only X-User-Id/X-User-Role fallback. Always disabled in production.
  allow_header_auth: false
  event_retention_days: 180
  session_cleanup_minutes: 30
  max_failed_logins: 5
  lockout_minutes: 15

rate_limit:
  enabled: true
  requests_per_minute: 120
  auth_requests_per_minute: 10
